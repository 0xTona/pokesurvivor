# Worker de PokéSurvivor: claves TURN del cooperativo y contador de gente en línea.
# Desplegar desde esta carpeta:  npx wrangler deploy
name = "pokesurvivor-turn"
main = "turn-worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false
keep_vars = true            # no borra las variables/secretos puestos en el panel

routes = [ { pattern = "turn.pokesurvivor.com", custom_domain = true } ]

[[durable_objects.bindings]]
name = "ONLINE"
class_name = "Online"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Online"]
